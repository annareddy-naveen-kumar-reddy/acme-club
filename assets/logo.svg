<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- ACME Club Modern Geometric Logo -->
  <defs>
    <linearGradient id="acmeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Geometric Emblem -->
  <g transform="translate(6, 6)">
    <!-- Ambient glow circle -->
    <circle cx="24" cy="24" r="22" fill="url(#glowGrad)" />
    
    <!-- Outer Hexagon / Shield outline -->
    <path d="M24 3 L43 14 L43 34 L24 45 L5 34 L5 14 Z" 
          stroke="url(#acmeGrad)" stroke-width="2.5" stroke-linejoin="round" fill="none" />
    
    <!-- Stylized 'A' & Circuit Node Shape -->
    <path d="M24 10 L35 34 H29 L26 27 H22 L19 34 H13 L24 10 Z" 
          fill="url(#acmeGrad)" />
    <polygon points="24,16 21,23 27,23" fill="#0A0F1D" />
    
    <!-- Core Node Dot -->
    <circle cx="24" cy="20" r="2" fill="#00D2FE" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(62, 16)">
    <!-- Main ACME text -->
    <text x="0" y="20" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="2.5" 
          fill="#FFFFFF">
      ACME
    </text>
    
    <!-- CLUB subtitle badge / text -->
    <text x="82" y="20" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="22" 
          font-weight="300" 
          letter-spacing="3" 
          fill="#00D2FE">
      CLUB
    </text>
    
    <!-- Sub-tagline -->
    <text x="1" y="32" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="8.5" 
          font-weight="500" 
          letter-spacing="2" 
          fill="#94A3B8">
      TECH • INNOVATE • LEAD
    </text>
  </g>
</svg>
