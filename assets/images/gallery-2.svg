<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="gal2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="50%" stop-color="#160c33" />
      <stop offset="100%" stop-color="#2a1254" />
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#gal2Bg)" />
  
  <!-- Neural Particles Grid -->
  <g opacity="0.2" stroke="#a855f7" stroke-width="1.5">
    <line x1="200" y1="100" x2="350" y2="200"/>
    <line x1="350" y1="200" x2="450" y2="200"/>
    <line x1="450" y1="200" x2="600" y2="100"/>
    <line x1="200" y1="340" x2="350" y2="200"/>
    <line x1="450" y1="200" x2="600" y2="340"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="210" r="140" fill="none" stroke="url(#purpleNeon)" stroke-width="2" stroke-dasharray="12 6" opacity="0.7"/>
  <circle cx="400" cy="210" r="85" fill="rgba(168, 85, 247, 0.1)" />

  <!-- AI Brain / Chip Central Graphic -->
  <rect x="290" y="115" width="220" height="190" rx="20" fill="rgba(22, 12, 51, 0.85)" stroke="url(#purpleNeon)" stroke-width="2.5" filter="url(#glow2)"/>
  
  <!-- AI Chip Pins -->
  <g stroke="#a855f7" stroke-width="3" stroke-linecap="round">
    <line x1="270" y1="160" x2="290" y2="160"/>
    <line x1="270" y1="210" x2="290" y2="210"/>
    <line x1="270" y1="260" x2="290" y2="260"/>
    <line x1="510" y1="160" x2="530" y2="160"/>
    <line x1="510" y1="210" x2="530" y2="210"/>
    <line x1="510" y1="260" x2="530" y2="260"/>
    <line x1="350" y1="95" x2="350" y2="115"/>
    <line x1="450" y1="95" x2="450" y2="115"/>
    <line x1="350" y1="305" x2="350" y2="325"/>
    <line x1="450" y1="305" x2="450" y2="325"/>
  </g>
  
  <!-- Center AI Node -->
  <circle cx="400" cy="210" r="32" fill="url(#purpleNeon)"/>
  <text x="400" y="217" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">AI</text>

  <!-- Title Badge -->
  <rect x="230" y="340" width="340" height="46" rx="23" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    HANDS-ON AI WORKSHOP
  </text>
  <text x="400" y="415" font-family="system-ui, monospace" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle" letter-spacing="2">
    MACHINE LEARNING & SYSTEMS • ACME
  </text>
</svg>
