<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="g2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#190d38" />
      <stop offset="100%" stop-color="#301366" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#g2Bg)" />
  
  <!-- Neural Particles Grid -->
  <g opacity="0.2" stroke="#a855f7" stroke-width="1.8">
    <line x1="160" y1="120" x2="340" y2="250"/>
    <line x1="340" y1="250" x2="460" y2="250"/>
    <line x1="460" y1="250" x2="640" y2="120"/>
    <line x1="160" y1="380" x2="340" y2="250"/>
    <line x1="460" y1="250" x2="640" y2="380"/>
    <circle cx="160" cy="120" r="8" fill="#ec4899"/>
    <circle cx="640" cy="120" r="8" fill="#a855f7"/>
    <circle cx="160" cy="380" r="8" fill="#a855f7"/>
    <circle cx="640" cy="380" r="8" fill="#ec4899"/>
  </g>

  <!-- Glowing Radial Circles -->
  <circle cx="400" cy="250" r="170" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="400" cy="250" r="110" fill="rgba(168, 85, 247, 0.08)" filter="url(#glow2)"/>

  <!-- AI Processor Core -->
  <rect x="280" y="140" width="240" height="220" rx="24" fill="rgba(25, 13, 56, 0.9)" stroke="url(#purpleGrad)" stroke-width="2.5" filter="url(#glow2)"/>
  
  <!-- Chip Connectors -->
  <g stroke="#a855f7" stroke-width="3.5" stroke-linecap="round">
    <line x1="255" y1="190" x2="280" y2="190"/>
    <line x1="255" y1="250" x2="280" y2="250"/>
    <line x1="255" y1="310" x2="280" y2="310"/>
    <line x1="520" y1="190" x2="545" y2="190"/>
    <line x1="520" y1="250" x2="545" y2="250"/>
    <line x1="520" y1="310" x2="545" y2="310"/>
    <line x1="340" y1="115" x2="340" y2="140"/>
    <line x1="460" y1="115" x2="460" y2="140"/>
    <line x1="340" y1="360" x2="340" y2="385"/>
    <line x1="460" y1="360" x2="460" y2="385"/>
  </g>
  
  <!-- Center AI Core Glow -->
  <circle cx="400" cy="250" r="42" fill="url(#purpleGrad)"/>
  <text x="400" y="258" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">AI</text>
</svg>
