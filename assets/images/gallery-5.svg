<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="g5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c1f" />
      <stop offset="50%" stop-color="#11193d" />
      <stop offset="100%" stop-color="#1c285e" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#g5Bg)" />
  
  <!-- Collaborative Connecting Lines -->
  <g opacity="0.2" stroke="#6366f1" stroke-width="2">
    <circle cx="160" cy="220" r="35" fill="none"/>
    <circle cx="640" cy="220" r="35" fill="none"/>
    <line x1="195" y1="220" x2="300" y2="220"/>
    <line x1="500" y1="220" x2="605" y2="220"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="250" r="170" fill="none" stroke="url(#indigoGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="400" cy="250" r="110" fill="rgba(99, 102, 241, 0.08)" filter="url(#glow5)"/>

  <!-- Mentorship Card -->
  <rect x="270" y="140" width="260" height="220" rx="20" fill="rgba(17, 25, 61, 0.9)" stroke="url(#indigoGrad)" stroke-width="2.5" filter="url(#glow5)"/>
  
  <!-- Team Nodes -->
  <circle cx="355" cy="205" r="26" fill="#6366f1"/>
  <path d="M320 280 C320 240, 390 240, 390 280" fill="#6366f1"/>
  
  <circle cx="445" cy="205" r="26" fill="#06b6d4"/>
  <path d="M410 280 C410 240, 480 240, 480 280" fill="#06b6d4"/>
  
  <!-- Synergy Bridge -->
  <path d="M380 215 L420 215" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
