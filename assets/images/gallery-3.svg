<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="g3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a14" />
      <stop offset="50%" stop-color="#053025" />
      <stop offset="100%" stop-color="#0b523f" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#g3Bg)" />
  
  <!-- Circuit Traces -->
  <g opacity="0.25" stroke="#10b981" stroke-width="2">
    <path d="M120 180 L240 180 L290 250 L290 360" fill="none"/>
    <path d="M680 180 L560 180 L510 250 L510 360" fill="none"/>
    <circle cx="120" cy="180" r="6" fill="#10b981"/>
    <circle cx="680" cy="180" r="6" fill="#10b981"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="250" r="170" fill="none" stroke="url(#greenGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="400" cy="250" r="110" fill="rgba(16, 185, 129, 0.08)" filter="url(#glow3)"/>

  <!-- Microcontroller Board -->
  <rect x="270" y="140" width="260" height="220" rx="20" fill="rgba(5, 48, 37, 0.9)" stroke="url(#greenGrad)" stroke-width="2.5" filter="url(#glow3)"/>
  
  <!-- Board Components -->
  <rect x="330" y="180" width="140" height="130" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2"/>
  <circle cx="365" cy="215" r="12" fill="#34d399"/>
  <circle cx="435" cy="215" r="12" fill="#06b6d4"/>
  <line x1="350" y1="265" x2="450" y2="265" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <line x1="370" y1="285" x2="430" y2="285" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
</svg>
