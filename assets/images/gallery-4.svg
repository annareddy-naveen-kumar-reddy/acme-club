<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="g4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0d02" />
      <stop offset="50%" stop-color="#361a05" />
      <stop offset="100%" stop-color="#542908" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#g4Bg)" />
  
  <!-- Spotlight Beams -->
  <g opacity="0.18">
    <polygon points="120 0 280 500 160 500" fill="#f59e0b"/>
    <polygon points="680 0 640 500 520 500" fill="#f59e0b"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="250" r="170" fill="none" stroke="url(#amberGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="400" cy="250" r="110" fill="rgba(245, 158, 11, 0.08)" filter="url(#glow4)"/>

  <!-- Speaker Card -->
  <rect x="280" y="140" width="240" height="220" rx="20" fill="rgba(54, 26, 5, 0.9)" stroke="url(#amberGrad)" stroke-width="2.5" filter="url(#glow4)"/>
  
  <!-- Microphone & Sound Waves -->
  <rect x="385" y="180" width="30" height="65" rx="15" fill="#f59e0b"/>
  <path d="M370 215 A30 30 0 0 0 430 215" stroke="#f59e0b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <line x1="400" y1="245" x2="400" y2="285" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="380" y1="285" x2="420" y2="285" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Audio Radiation Waves -->
  <path d="M345 200 A60 60 0 0 0 345 250" stroke="#ef4444" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M455 200 A60 60 0 0 1 455 250" stroke="#ef4444" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
