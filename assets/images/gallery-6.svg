<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="gal6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1302" />
      <stop offset="50%" stop-color="#3d2804" />
      <stop offset="100%" stop-color="#5c3c06" />
    </linearGradient>
    <linearGradient id="goldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#gal6Bg)" />
  
  <!-- Trophy / Award Ray Lines -->
  <g opacity="0.15" stroke="#fbbf24" stroke-width="2">
    <line x1="400" y1="210" x2="150" y2="80"/>
    <line x1="400" y1="210" x2="650" y2="80"/>
    <line x1="400" y1="210" x2="200" y2="350"/>
    <line x1="400" y1="210" x2="600" y2="350"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="210" r="140" fill="none" stroke="url(#goldNeon)" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>
  <circle cx="400" cy="210" r="85" fill="rgba(251, 191, 36, 0.12)" />

  <!-- Trophy Card -->
  <rect x="290" y="115" width="220" height="190" rx="20" fill="rgba(61, 40, 4, 0.85)" stroke="url(#goldNeon)" stroke-width="2.5" filter="url(#glow6)"/>
  
  <!-- Golden Trophy Icon -->
  <path d="M360 150 L440 150 L430 210 Q400 235 370 210 Z" fill="#fbbf24"/>
  <!-- Trophy handles -->
  <path d="M360 160 Q335 175 363 195" stroke="#fbbf24" stroke-width="3.5" fill="none"/>
  <path d="M440 160 Q465 175 437 195" stroke="#fbbf24" stroke-width="3.5" fill="none"/>
  <!-- Trophy base -->
  <line x1="400" y1="225" x2="400" y2="255" stroke="#fbbf24" stroke-width="6"/>
  <rect x="365" y="255" width="70" height="15" rx="3" fill="#f59e0b"/>

  <!-- Title Badge -->
  <rect x="210" y="340" width="380" height="46" rx="23" fill="rgba(251, 191, 36, 0.12)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    ANNUAL AWARDS &amp; FELICITATION
  </text>
  <text x="400" y="415" font-family="system-ui, monospace" font-size="13" font-weight="600" fill="#fde047" text-anchor="middle" letter-spacing="2">
    STUDENT EXCELLENCE &amp; RECOGNITION • ACME
  </text>
</svg>
