<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="g6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1102" />
      <stop offset="50%" stop-color="#382404" />
      <stop offset="100%" stop-color="#573606" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#g6Bg)" />
  
  <!-- Ray Lines -->
  <g opacity="0.18" stroke="#fbbf24" stroke-width="2.5">
    <line x1="400" y1="250" x2="120" y2="100"/>
    <line x1="400" y1="250" x2="680" y2="100"/>
    <line x1="400" y1="250" x2="180" y2="420"/>
    <line x1="400" y1="250" x2="620" y2="420"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="250" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="400" cy="250" r="110" fill="rgba(251, 191, 36, 0.1)" filter="url(#glow6)"/>

  <!-- Trophy Card -->
  <rect x="280" y="140" width="240" height="220" rx="20" fill="rgba(56, 36, 4, 0.9)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow6)"/>
  
  <!-- Trophy Graphic -->
  <path d="M350 180 L450 180 L440 250 Q400 280 360 250 Z" fill="#fbbf24"/>
  <path d="M350 190 Q320 205 355 235" stroke="#fbbf24" stroke-width="4.5" fill="none"/>
  <path d="M450 190 Q480 205 445 235" stroke="#fbbf24" stroke-width="4.5" fill="none"/>
  <line x1="400" y1="270" x2="400" y2="305" stroke="#fbbf24" stroke-width="7"/>
  <rect x="360" y="305" width="80" height="18" rx="4" fill="#f59e0b"/>
</svg>
